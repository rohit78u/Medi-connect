name: MediConnect CI/CD

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Tests and Code Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: mediconnect_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediconnect_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check app tests --select E4,E7,E9,F --ignore F821

      - name: Run tests with coverage
        env:
          DATABASE_URI: postgresql+asyncpg://postgres:ci_test_password@localhost:5432/mediconnect_db
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          POSTGRES_PASSWORD: ci_test_password
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci-test-razorpay-secret
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing tests/

      - name: Compile Python sources
        run: python -m compileall -q app

  docker-build:
    name: Build Docker image
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mediconnect-ai:ci
