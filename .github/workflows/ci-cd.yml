name: MediConnect CI/CD

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Tests and Code Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: mediconnect_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediconnect_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        env:
          DATABASE_URI: postgresql+asyncpg://postgres:ci_test_password@localhost:5432/mediconnect_db
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          POSTGRES_PASSWORD: ci_test_password
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci-test-razorpay-secret
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing tests/
      - name: Compile Python sources
        run: python -m compileall -q app

  docker-build:
    name: Build Docker image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mediconnect-ai:ci

  production-config:
    name: Validate Production Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create CI-only production environment
        working-directory: backend
        run: |
          cat > .env.production <<'EOF'
          PROJECT_NAME="MediConnect CI"
          ENVIRONMENT="production"
          DEBUG=False
          SECRET_KEY="ci-only-secret-not-for-production"
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=ci_db
          DATABASE_URI="postgresql+asyncpg://ci_user:ci_password@db:5432/ci_db"
          REDIS_HOST=redis
          REDIS_PORT=6379
          CELERY_BROKER_URL="redis://redis:6379/0"
          CELERY_RESULT_BACKEND="redis://redis:6379/0"
          BACKEND_CORS_ORIGINS=["http://localhost"]
          GEMINI_API_KEY="ci-placeholder"
          RAZORPAY_KEY_ID="rzp_test_ci"
          RAZORPAY_KEY_SECRET="ci-placeholder"
          MEDICAL_DOCUMENT_STORAGE="/app/storage/medical_documents"
          EOF
      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Verify required production services
        run: |
          docker compose -f docker-compose.production.yml config --services | grep -qx db
          docker compose -f docker-compose.production.yml config --services | grep -qx redis
          docker compose -f docker-compose.production.yml config --services | grep -qx backend
          docker compose -f docker-compose.production.yml config --services | grep -qx celery
